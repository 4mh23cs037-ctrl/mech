services:
  - type: web
    name: mit-mysore-3d-printing-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ADMIN_EMAIL
        value: admin@mitmysore.in
      - key: ADMIN_PASSWORD
        value: mitmech3d
      - key: CORS_ORIGINS
        value: "*"

